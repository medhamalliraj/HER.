<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HER. — Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1 class="brand-logo">HER. <span>🎀</span></h1>
        <p class="auth-subtitle">Create your personal sanctuary.</p>
        
        {% if error %}
            <p class="error-banner">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('signup') }}" method="POST" class="auth-form">
            <input type="text" name="display_name" placeholder="Your Name (e.g. Medha)" required>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Create Space</button>
        </form>

        <p class="auth-footer">Already registered? <a href="{{ url_for('login') }}">Sign in here</a>.</p>
    </div>
</body>
</html>
